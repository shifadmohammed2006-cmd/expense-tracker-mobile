# Optional: Render "Blueprint" for the API. Or just create the service by hand (see README).
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # you paste this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      # In-app update gate (edit these in the Render dashboard when you release a new APK)
      - key: APP_LATEST_VERSION
        value: 2.2.0
      - key: APP_MIN_VERSION
        value: 2.2.0
      - key: APP_APK_URL
        value: https://github.com/shifadmohammed2006-cmd/expense-tracker-mobile/releases/download/v2.2.0/Expense-Tracker-v2.2.0.apk
      - key: APP_UPDATE_NOTES
        value: 'Group trips: share a join code with friends. Faster, smoother app.'
      - key: OLD_APP_MESSAGE
        value: |-
          NEW VERSION AVAILABLE - UPDATE REQUIRED.
          1) Open Chrome.
          2) Type: https://expense-tracker-api-s6yg.onrender.com/update
          3) Tap Download, then Install.
          Your data is safe - just log in again.
      # Set to 'true' ONLY when the APK link is ready: blocks the old v1 app and tells people to update
      - key: FORCE_UPDATE_OLD_APPS
        value: 'false'
