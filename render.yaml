# Optional: Render "Blueprint" for the API. Or just create the service by hand (see README).
services:
  - type: web
    name: expense-tracker-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false        # you paste this in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: APP_LATEST_VERSION
        value: '2.1.0'
      - key: APP_MIN_VERSION
        value: '2.1.0'
      - key: APP_APK_URL
        value: 'https://github.com/shifadmohammed2006-cmd/expense-tracker-mobile/releases/download/v2.1.0/Expense-Tracker-v2.1.apk'
      - key: APP_UPDATE_NOTES
        value: 'Offline mode, trip planner, calculator, and a redesigned interface.'
      - key: FORCE_UPDATE_OLD_APPS
        value: 'true'
